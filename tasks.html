<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks · Anchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="index.html">Anchor</a>
  <nav aria-label="Main">
    <ul>
      <li><a href="tasks.html" aria-current="page">Tasks</a></li>
      <li><a href="cards.html">Cards</a></li>
      <li><a href="reader.html">Reader</a></li>
      <li><a href="relax.html">Relax</a></li>
    </ul>
  </nav>
</header>
<main id="main">
<h1>Break a task down</h1>
<p>Add a task, split it into small steps, then give a step some time.</p>
<div class="grid">
  <section class="panel" aria-labelledby="t-h">
    <h2 id="t-h">Your steps</h2>
    <div class="row" role="group" aria-label="Add a step">
      <div style="flex:1 1 200px"><label for="new-step">New step</label><input type="text" id="new-step" placeholder="e.g. Open the document"></div>
      <button type="button" class="primary" id="add-step">Add step</button>
    </div>
    <ul class="task-list" id="step-list" aria-live="polite">
      <li><input type="checkbox" id="s1" aria-labelledby="s1l"><span id="s1l">Example step: gather what you need</span><button type="button" aria-label="Remove step">✕</button></li>
      <li><input type="checkbox" id="s2" aria-labelledby="s2l"><span id="s2l">Example step: do the first small part</span><button type="button" aria-label="Remove step">✕</button></li>
    </ul>
    <button type="button" id="split-task" style="margin-top:1rem">Split a big task for me</button>
    <p id="task-status" role="status" style="margin-top:.5rem"></p>
  </section>
  <section class="panel" aria-labelledby="tm-h">
    <h2 id="tm-h">Time for this step</h2>
    <fieldset class="styles"><legend>Timer look</legend>
      <label><input type="radio" name="tstyle" value="ring" checked> Ring</label>
      <label><input type="radio" name="tstyle" value="grow"> Growing circle</label>
      <label><input type="radio" name="tstyle" value="glass"> Hourglass</label>
    </fieldset>
    <div class="timer">
      <svg class="ring" data-visual="ring" viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="90"/><circle class="fill" id="timer-ring" cx="100" cy="100" r="90"/></svg>
      <div class="grow-wrap" data-visual="grow" hidden aria-hidden="true"><div class="grow" id="grow-circle"></div></div>
      <svg class="glass" data-visual="glass" viewBox="0 0 100 140" hidden aria-hidden="true">
        <defs><clipPath id="clip-top"><rect id="glass-top-clip" x="0" y="10" width="100" height="60"/></clipPath><clipPath id="clip-bot"><rect id="glass-bot-clip" x="0" y="130" width="100" height="0"/></clipPath></defs>
        <polygon points="15,10 85,10 52,70 48,70" fill="#d9b88f" clip-path="url(#clip-top)"/>
        <polygon points="48,70 52,70 85,130 15,130" fill="#d9b88f" clip-path="url(#clip-bot)"/>
        <line id="glass-stream" x1="50" y1="70" x2="50" y2="130" stroke="#d9b88f" stroke-width="1.5" opacity="0"/>
        <path d="M12 8H88M12 132H88" stroke="#ebe6dd" stroke-width="4" stroke-linecap="round"/>
        <path d="M15 10L48 70L15 130M85 10L52 70L85 130" fill="none" stroke="#ebe6dd" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="readout" id="timer-readout">10:00</div>
    <p id="timer-phase" role="status" style="text-align:center;margin:0 auto"></p>
    <div class="row" style="margin-top:1rem;justify-content:center">
      <label for="minutes" class="sr-only">Minutes</label>
      <input type="number" id="minutes" value="10" min="1" max="120" style="width:6rem">
      <button type="button" class="primary" id="timer-start">Start</button>
      <button type="button" id="timer-pause">Pause</button>
      <button type="button" id="timer-reset">Reset</button>
    </div>
    <p class="buffer panel" style="margin-top:1rem;padding:.8rem 1rem"><label for="buffer-on" style="display:inline"><input type="checkbox" id="buffer-on"> Add a 5 minute buffer after this step</label></p>
  </section>
</div>
</main>
<script src="js/tasks.js" defer></script>
</body>
</html>
