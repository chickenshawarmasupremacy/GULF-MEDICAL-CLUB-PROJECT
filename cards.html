<html lang="en">
<head>

</head>
<body>

  <a class="brand" href="index.html">Anchor</a>
  <nav aria-label="Main">
    <ul>
      <li><a href="tasks.html">Tasks</a></li>

      <li><a href="reader.html">Reader</a></li>

    </ul>
  </nav>
</header>
<main id="main">
<h1>Show a card</h1>
<p>Tap a card to show it full screen. Tap again to close it.</p>
<section aria-labelledby="c-h">
  <h2 id="c-h">Your cards</h2>
  <div class="card-grid" id="card-grid">
    <button type="button" class="talk-card" data-tone="stop">I do not feel ready to talk to anyone yet.</button>
    <button type="button" class="talk-card" data-tone="stop">I need quiet right now.</button>
    <button type="button" class="talk-card" data-tone="need">I need some space. Please stay nearby.</button>
    <button type="button" class="talk-card" data-tone="need">Please give me a few minutes.</button>
    <button type="button" class="talk-card" data-tone="need">I can hear you, but I can't answer yet.</button>
    <button type="button" class="talk-card" data-tone="ok">Please text or write to me instead.</button>
    <button type="button" class="talk-card" data-tone="ok">I'm okay. I just need a moment.</button>
    <button type="button" class="talk-card" data-tone="need">I need help. Please stay with me.</button>
  </div>
</section>
<section class="panel" aria-labelledby="n-h">
  <h2 id="n-h">Make your own card</h2>
  <label for="custom-text">What should it say?</label>
  <textarea id="custom-text" rows="3"></textarea>
  <div class="row" style="margin-top:1rem">
    <label for="custom-tone" class="sr-only">Card colour</label>
    <select id="custom-tone" style="width:auto"><option value="ok">Okay</option><option value="need">Need</option><option value="stop">Stop</option></select>
    <button type="button" class="primary" id="save-card">Save card</button>
  </div>
</section>
<div class="show-card" id="show-card" role="dialog" aria-modal="true" aria-label="Card" data-open="false"><span id="show-card-text"></span></div>
</main>
<!-- <script type="module" src="js/cards.js"></script> -->
</body>
</html>
